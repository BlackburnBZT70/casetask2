<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс-задача № 3</title>
    <style>
        /* Базовые настройки страницы и шрифтов */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        /* Карточка-контейнер слайдера с рамкой и тенью */
        .slider-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 720px;
            padding: 28px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .slider-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #1e293b;
        }

        /* Область отображения изображений */
        .image-viewport {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 12px;
            border: 3px solid #cbd5e1;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: #f1f5f9;
            margin-bottom: 18px;
        }

        .slider-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.25s ease-in-out, transform 0.3s ease;
        }

        /* Индикатор текущего номера изображения ("Изображение 1 из 5") */
        .image-counter {
            display: inline-block;
            font-size: 16px;
            font-weight: 600;
            color: #475569;
            background-color: #f1f5f9;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* Панель кнопок управления */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background-color: #2563eb;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <div class="slider-card">
        <h1 class="slider-title">Галерея изображений</h1>

        <!-- Область отображения изображения -->
        <div class="image-viewport">
            <img id="slider-img" class="slider-image" src="" alt="Слайд галереи">
        </div>

        <!-- Счётчик текущего изображения -->
        <div id="counter" class="image-counter">Изображение 1 из 5</div>

        <!-- Кнопки навигации -->
        <div class="controls">
            <button id="prev-btn" class="btn">&#8592; Назад</button>
            <button id="next-btn" class="btn">Вперед &#8594;</button>
        </div>
    </div>

    <script>
        // Массив со ссылками на 5 изображений
        const images = [
            "https://picsum.photos/id/1015/800/500",
            "https://picsum.photos/id/1018/800/500",
            "https://picsum.photos/id/1039/800/500",
            "https://picsum.photos/id/1043/800/500",
            "https://picsum.photos/id/1050/800/500"
        ];

        // Текущий индекс изображения (начинаем с первого: 0)
        let currentIndex = 0;

        // Получаем ссылки на DOM-элементы
        const sliderImg = document.getElementById('slider-img');
        const counterText = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Функция обновления изображения и счётчика
        function updateSlider() {
            // Плавный эффект смены кадра
            sliderImg.style.opacity = '0.3';
            
            setTimeout(() => {
                sliderImg.src = images[currentIndex];
                counterText.textContent = `Изображение ${currentIndex + 1} из ${images.length}`;
                sliderImg.style.opacity = '1';
            }, 120);
        }

        // Слушатель события для кнопки "Вперед" (с зацикливанием)
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            updateSlider();
        });

        // Слушатель события для кнопки "Назад" (с зацикливанием)
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateSlider();
        });

        // Инициализация слайдера при загрузке страницы
        sliderImg.src = images[currentIndex];
        counterText.textContent = `Изображение ${currentIndex + 1} из ${images.length}`;
    </script>
</body>
</html>
